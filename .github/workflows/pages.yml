name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Publishes to the gh-pages branch rather than a Pages Actions deployment.
# The Actions route needs the Pages site to already exist, and creating it
# via actions/configure-pages `enablement: true` requires repo-admin rights
# the workflow GITHUB_TOKEN cannot hold ("Resource not accessible by
# integration"). A gh-pages branch, by contrast, is picked up by GitHub's
# own pages-build-deployment with no one-time console step.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Build site
        run: python tools/build_site.py
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
