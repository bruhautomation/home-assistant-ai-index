name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate entries against schema and evidence policy
        run: python tools/validate.py
      - name: Rating algorithm regression tests
        run: python tools/test_rating.py
      - name: README tables in sync
        run: python tools/render_readme.py --check
      - name: Site builds
        run: python tools/build_site.py
