id: openai-conversation
name: OpenAI Conversation
repo: home-assistant/core
url: https://www.home-assistant.io/integrations/openai_conversation/
category: conversation-agent
install: [core-integration]
summary: Official OpenAI (ChatGPT) conversation agent for Assist, with optional control of exposed entities.
providers: [openai]
inference: [cloud]
capabilities:
  reads_entity_states: true
  reads_camera: false
  reads_history: false
  listens_microphone: false
  controls_devices: true
  creates_automations: false
  edits_files: false
  executes_code: false
  runs_unattended: false
data_sent:
  - conversation text
  - names, states, and attributes of entities you expose to Assist
notes: >
  Device control is opt-in ("Control Home Assistant" setting) and bounded by
  Assist entity exposure. Camera frames can reach OpenAI if you attach snapshots
  through the AI Task framework (see the ai-task entry) — the integration does
  not access cameras on its own.
added: 2026-08-06
