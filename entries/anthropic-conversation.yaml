id: anthropic-conversation
name: Anthropic Claude
repo: home-assistant/core
url: https://www.home-assistant.io/integrations/anthropic/
category: conversation-agent
install: [core-integration]
summary: Official Anthropic (Claude) conversation agent for Assist, with optional control of exposed entities.
providers: [anthropic]
inference: [cloud]
capabilities:
  reads_entity_states: true
  reads_camera: false
  reads_history: false
  listens_microphone: false
  controls_devices: true
  creates_automations: false
  edits_files: false
  executes_code: false
  runs_unattended: false
data_sent:
  - conversation text
  - names, states, and attributes of entities you expose to Assist
notes: >
  Device control is opt-in and bounded by Assist entity exposure. Camera frames
  can reach Anthropic if you attach snapshots through the AI Task framework
  (see the ai-task entry) — the integration does not access cameras on its own.
added: 2026-08-06
